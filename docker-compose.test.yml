services:
  backend_test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://iarh:${POSTGRES_PASSWORD:-iarh}@postgres:5432/iarh
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JWT_SECRET_KEY: test-only-secret
      RUN_DB_TESTS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["pytest", "-q"]
