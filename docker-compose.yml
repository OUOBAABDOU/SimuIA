services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - iarh_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: iarh
      POSTGRES_USER: iarh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iarh}
    ports:
      - "5432:5432"
    volumes:
      - iarh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iarh -d iarh"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-iarh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-iarh-minio-secret-change-me}
    volumes:
      - iarh_minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio_init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-iarh} ${MINIO_ROOT_PASSWORD:-iarh-minio-secret-change-me} &&
       mc mb --ignore-existing local/iarh-media"

  livekit:
    image: livekit/livekit-server:v1.13.1
    command: ["--config", "/etc/livekit/livekit.yaml"]
    volumes:
      - ./infra/livekit.yaml:/etc/livekit/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"

  livekit_egress:
    image: livekit/egress:v1.12.0
    environment:
      EGRESS_CONFIG_FILE: /etc/egress/egress.yaml
    volumes:
      - ./infra/egress.yaml:/etc/egress/egress.yaml:ro
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    cap_add:
      - SYS_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x egress >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://iarh:${POSTGRES_PASSWORD:-iarh}@postgres:5432/iarh
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://localhost:8080,http://localhost:3000
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-disabled}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-USD}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:-http://localhost}
      PAYMENT_CANCEL_URL: ${PAYMENT_CANCEL_URL:-http://localhost}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      VERTEX_AI_ENABLED: ${VERTEX_AI_ENABLED:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY:-}
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
      LIVEKIT_API_KEY: iarh-dev
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-iarh-livekit-dev-secret-change-me}
      MEDIA_S3_ENDPOINT: http://minio:9000
      MEDIA_S3_BUCKET: iarh-media
      MEDIA_S3_REGION: us-east-1
      MEDIA_S3_ACCESS_KEY: iarh
      MEDIA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-iarh-minio-secret-change-me}
      MEDIA_S3_PUBLIC_ENDPOINT: ${MEDIA_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-CHANGE_ME_IN_PRODUCTION}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

  celery_worker:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://iarh:${POSTGRES_PASSWORD:-iarh}@postgres:5432/iarh
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-disabled}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-USD}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:-http://localhost}
      PAYMENT_CANCEL_URL: ${PAYMENT_CANCEL_URL:-http://localhost}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      VERTEX_AI_ENABLED: ${VERTEX_AI_ENABLED:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY:-}
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
      LIVEKIT_API_KEY: iarh-dev
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-iarh-livekit-dev-secret-change-me}
      MEDIA_S3_ENDPOINT: http://minio:9000
      MEDIA_S3_BUCKET: iarh-media
      MEDIA_S3_REGION: us-east-1
      MEDIA_S3_ACCESS_KEY: iarh
      MEDIA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-iarh-minio-secret-change-me}
      MEDIA_S3_PUBLIC_ENDPOINT: ${MEDIA_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-CHANGE_ME_IN_PRODUCTION}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "-Q", "default,ai,media,transcription"]


  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  iarh_postgres_data:
  iarh_redis_data:
  iarh_minio_data:
