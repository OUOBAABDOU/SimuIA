substitutions:
  _REGION: us-central1
  _BACKEND_SERVICE: iarh-backend
  _FRONTEND_SERVICE: iarh-frontend
  _LIVEKIT_PUBLIC_URL: wss://livekit.example.com
  _MEDIA_S3_PUBLIC_ENDPOINT: https://media.example.com
  _CORS_ORIGINS: https://app.example.com

steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, gcr.io/$PROJECT_ID/iarh-backend:$SHORT_SHA, ./backend]
  - name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/iarh-backend:$SHORT_SHA]
  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image=gcr.io/$PROJECT_ID/iarh-backend:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=APP_ENV=production,VERTEX_AI_ENABLED=true,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION},LIVEKIT_PUBLIC_URL=${_LIVEKIT_PUBLIC_URL},MEDIA_S3_PUBLIC_ENDPOINT=${_MEDIA_S3_PUBLIC_ENDPOINT},CORS_ORIGINS=${_CORS_ORIGINS},EMAIL_VERIFICATION_REQUIRED=true,EMAIL_DELIVERY_MODE=smtp
      - --set-secrets=DATABASE_URL=iarh-database-url:latest,JWT_SECRET_KEY=iarh-jwt-secret:latest,LIVEKIT_API_KEY=iarh-livekit-key:latest,LIVEKIT_API_SECRET=iarh-livekit-secret:latest,MEDIA_S3_ACCESS_KEY=iarh-storage-access-key:latest,MEDIA_S3_SECRET_KEY=iarh-storage-secret:latest,AI_CREDENTIAL_ENCRYPTION_KEY=iarh-ai-encryption-key:latest,SMTP_HOST=iarh-smtp-host:latest,SMTP_USERNAME=iarh-smtp-username:latest,SMTP_PASSWORD=iarh-smtp-password:latest,EMAIL_FROM=iarh-email-from:latest
images:
  - gcr.io/$PROJECT_ID/iarh-backend:$SHORT_SHA
